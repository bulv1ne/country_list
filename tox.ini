[tox]
envlist = py3{12,13,14,15}, ruff-{format,check} mypy

[travis]
python =
    3.15: py315 ruff-format, ruff-check, mypy
    3.14: py314
    3.13: py313
    3.12: py312

[testenv:ruff-format]
basepython = python
deps = ruff
commands = ruff format .

[testenv:ruff-check]
basepython = python
deps = ruff
commands = ruff check --select=I .

[testenv:mypy]
basepython = python
deps = mypy
commands = mypy country_list

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps = coverage
commands = coverage erase
           coverage run -m unittest
           coverage report -m
