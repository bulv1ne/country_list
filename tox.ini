[tox]
envlist = py3{12,13,14,15}, flake8, isort, black, mypy

[travis]
python =
    3.15: py315, flake8, isort, black, mypy
    3.14: py314
    3.13: py313
    3.12: py312

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 country_list

[testenv:isort]
basepython = python
deps = isort
commands = isort --check-only --diff country_list

[testenv:black]
basepython = python
deps = black
commands = black --check country_list

[testenv:mypy]
basepython = python
deps = mypy
commands = mypy country_list

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps = coverage
commands = coverage erase
           coverage run -m unittest
           coverage report -m
